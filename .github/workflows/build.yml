name: build-and-lint

on:
  push:
    branches: [main, dev, "feat/**", "test/**", "pr/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt formatted:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          only-new-issues: false

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true

      - name: Build
        run: |
          go build -trimpath -o /tmp/tls-proxy ./cmd/server
          go build -trimpath -o /tmp/api ./api/index.go

      - name: Unit tests
        run: go test -race -count=1 ./...

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: tls-proxy
          path: /tmp/tls-proxy
          if-no-files-found: error

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: arisucatalystlab/tls-proxy:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
