services:
  tls-proxy:
    build: .
    image: arisucatalystlab/tls-proxy:latest
    container_name: tls-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "1080:1080"
    environment:
      TLS_PROXY_PORT: "8080"
      # Required to prevent open-proxy abuse.
      # TLS_PROXY_API_KEY: "replace-with-a-secret"
      TLS_PROXY_DEFAULT_PROFILE: "chrome_120"
      TLS_PROXY_DEFAULT_TIMEOUT: "30"
      TLS_PROXY_MAX_BODY_SIZE: "10485760"
      TLS_PROXY_MAX_RESPONSE_SIZE: "20971520"
      TLS_PROXY_LOG_LEVEL: "info"
      # Enables the HTTP forward proxy (on port 8080) and the SOCKS5 proxy
      # (on port 1080). Disabled by default outside Docker.
      TLS_PROXY_ENABLE_PROXY: "true"
      TLS_PROXY_SOCKS5_ADDR: ":1080"
      # Optional: route through an upstream proxy (http/https/socks5).
      # TLS_PROXY_UPSTREAM_PROXY: "http://user:pass@host:port"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
